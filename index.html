<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7cc6de" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Бип-Бип Автобус</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Бип-Бип" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #2d2a32; overflow: hidden;
        touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #7cc6de; color: #2d2a32;
        font: 800 24px Rubik, Arial, sans-serif; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; padding: 24px; box-sizing: border-box; }
      #rotate svg { width: 120px; height: 120px; animation: tilt 1.6s ease-in-out infinite; }
      @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="30" y="10" width="40" height="80" rx="8" fill="#fff6e0" stroke="#2d2a32" stroke-width="5"/><circle cx="50" cy="80" r="4" fill="#2d2a32"/></svg>
      <div id="rotate-text">Поверни устройство горизонтально</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
